services:
  - type: web
    name: wms-backend
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    rootDir: backend
    envVars:
      - key: DATABASE_PATH
        value: data/wms.sqlite3
      - key: JWT_SECRET
        generateValue: true
      - key: ALLOWED_ORIGIN_REGEX
        value: "^https://[a-z0-9-]+\\.onrender\\.com$"
      - key: PYTHON_VERSION
        value: 3.13.0

  - type: web
    name: wms-frontend
    env: node
    plan: free
    buildCommand: "npm install && npm run build"
    startCommand: "npm run start"
    rootDir: frontend
    envVars:
      - key: NODE_VERSION
        value: ~22.0.0
      - key: NEXT_PUBLIC_API_BASE
        fromService:
          type: web
          name: wms-backend
          envVarKey: RENDER_EXTERNAL_URL
